# git-cliff config for gitmoji commits ("✨ feat: add x") and plain conventional
# commits ("feat: add x", "build(deps): bump y"). Generate with:
# git-cliff --tag v<x.y.z> -o CHANGELOG.md (tags are v<x.y.z>; babeli-x.y.z are the old maven-release-plugin tags)

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
# "✨ feat(cli): add x" -> "✨ add x" (keeps the emoji for grouping below)
commit_preprocessors = [{ pattern = '^([^\x00-\x7F]+)\s+\w+(\([^)]*\))?!?:\s*', replace = "${1} " }]
commit_parsers = [
  { message = "^🔖", skip = true },
  { message = "^chore(\\(release\\))?!?: (release|v[0-9]|prepare next)", skip = true },
  { message = "^\\[maven-release-plugin\\]", skip = true },
  { message = "^prepare (release|for next development)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^(💥|\\w+(\\([^)]*\\))?!:)", group = "<!-- 00 -->Breaking changes" },
  { message = "^(✨|feat)", group = "<!-- 01 -->Features" },
  { message = "^(🐛|🚑|fix)", group = "<!-- 02 -->Bug fixes" },
  { message = "^🔒", group = "<!-- 03 -->Security" },
  { message = "^(⚡|perf)", group = "<!-- 04 -->Performance" },
  { message = "^(♻|🔨|refactor|refac)", group = "<!-- 05 -->Refactoring" },
  { message = "^(⬆|⬇|➕|➖|📌|deps|build\\(deps)", group = "<!-- 06 -->Dependencies" },
  { message = "^(📝|docs)", group = "<!-- 07 -->Documentation" },
  { message = "^(✅|🧪|test)", group = "<!-- 08 -->Tests" },
  { message = "^(👷|💚|ci)", group = "<!-- 09 -->CI" },
  { message = "^(🎨|style)", group = "<!-- 10 -->Style" },
  { message = "^(🔧|📦|🙈|chore|build)", group = "<!-- 11 -->Chores" },
  { message = ".*", group = "<!-- 99 -->Other" },
]
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
