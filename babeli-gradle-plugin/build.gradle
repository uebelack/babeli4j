plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'dev.uebelacker.babeli'
version = '1.0.2-SNAPSHOT'

java {
    withJavadocJar()
    withSourcesJar()
}

// minimum supported Java version (previous LTS), same as maven.compiler.release in the parent pom
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'dev.uebelacker.babeli:babeli-core:1.0.2-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.0'
    testImplementation 'org.assertj:assertj-core:3.27.6'
}

gradlePlugin {
    plugins {
        babeli {
            id = 'dev.uebelacker.babeli'
            implementationClass = 'dev.uebelacker.babeli.gradle.BabeliPlugin'
        }
    }
}

testing {
    suites {
        functionalTest(JvmTestSuite) {
            useJUnitJupiter('5.13.0')
            dependencies {
                implementation 'org.assertj:assertj-core:3.27.6'
                runtimeOnly 'org.junit.platform:junit-platform-launcher:1.13.0'
                implementation 'dev.uebelacker.babeli:babeli-core:1.0.2-SNAPSHOT'
            }
        }
    }
}

gradlePlugin.testSourceSets.add(sourceSets.functionalTest)

tasks.named('check') {
    dependsOn testing.suites.functionalTest
}
