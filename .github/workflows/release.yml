name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  maven-central:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history

      # Writes a settings.xml with the "central" server (credentials from the
      # env vars named here) and imports the signing key.
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check tag matches project version
        run: test "v$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$GITHUB_REF_NAME"

      - name: Check formatting
        run: ./mvnw -B spotless:check

      # Runs all tests (including the Gradle plugin build), signs and uploads to
      # the Central Portal. With autoPublish=false the deployment waits there
      # until a maintainer clicks "Publish" on central.sonatype.com.
      - name: Deploy to Maven Central
        run: ./mvnw -B deploy -Prelease
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.changelog }}" \
            "babeli-cli/target/babeli-cli-${GITHUB_REF_NAME#v}.jar#babeli-cli.jar"
        env:
          GH_TOKEN: ${{ github.token }}

  gradle-plugin-portal:
    needs: maven-central
    runs-on: ubuntu-latest
    # waits for the Central deployment to be published by hand
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The plugin depends on babeli-core of the same version, which is only
      # resolvable once the deployment above has been published on Central.
      - name: Wait for babeli-core on Maven Central
        run: |
          url="https://repo1.maven.org/maven2/dev/uebelacker/babeli/babeli-core/${GITHUB_REF_NAME#v}/babeli-core-${GITHUB_REF_NAME#v}.pom"
          until curl -sfI "$url" > /dev/null; do
            echo "Waiting for $url (publish the deployment on central.sonatype.com)"
            sleep 60
          done

      - name: Publish to the Gradle Plugin Portal
        working-directory: babeli-gradle-plugin
        run: ./gradlew publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
