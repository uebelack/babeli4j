name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # report both Java versions even if one of them fails
      fail-fast: false
      matrix:
        # previous LTS (= maven.compiler.release) and current LTS
        java: [ 21, 25 ]

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud needs the history for blame / new code

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      # caches the Gradle wrapper and dependencies of the nested babeli-gradle-plugin build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check formatting
        run: ./mvnw -B spotless:check

      # install, not verify: the Gradle plugin build (run by the reactor) resolves
      # babeli-core from the local Maven repository
      - name: Build and test
        run: ./mvnw -B install

      # Skipped on fork PRs, where the secret is not available.
      - name: Cache SonarCloud packages
        if: matrix.java == 25 && env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        if: matrix.java == 25 && env.SONAR_TOKEN != ''
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
